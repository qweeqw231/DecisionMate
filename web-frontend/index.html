<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DecisionMate · 个人决策支持系统</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231E40AF'/%3E%3Ctext x='32' y='43' font-family='Segoe UI,Arial,sans-serif' font-size='28' font-weight='bold' fill='%23F97316' text-anchor='middle'%3EDM%3C/text%3E%3C/svg%3E">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- DecisionMate 启动器心跳：关闭页面后自动停止后端（非快捷方式启动时无副作用；构建后自动带入静态产物） -->
    <script>
      (function () {
        var HB = 'http://127.0.0.1:8011/beat';
        var BYE = 'http://127.0.0.1:8011/bye';
        function send(u) {
          try {
            if (navigator.sendBeacon) { navigator.sendBeacon(u, '1'); return; }
            fetch(u, { method: 'POST', keepalive: true, body: '1' }).catch(function () {});
          } catch (e) {}
        }
        send(HB);
        setInterval(function () { send(HB); }, 8000);
        window.addEventListener('pagehide', function () { send(BYE); });
      })();
    </script>
  </body>
</html>
