<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DecisionMate · 个人决策支持系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- DecisionMate 启动器心跳：关闭页面后自动停止后端（非快捷方式启动时无副作用；构建后自动带入静态产物） -->
    <script>
      (function () {
        var HB = 'http://127.0.0.1:8011/beat';
        var BYE = 'http://127.0.0.1:8011/bye';
        function send(u) {
          try {
            if (navigator.sendBeacon) { navigator.sendBeacon(u, '1'); return; }
            fetch(u, { method: 'POST', keepalive: true, body: '1' }).catch(function () {});
          } catch (e) {}
        }
        send(HB);
        setInterval(function () { send(HB); }, 8000);
        window.addEventListener('pagehide', function () { send(BYE); });
      })();
    </script>
  </body>
</html>
