name: CI

# P2 新增：项目此前没有任何 CI，回归全靠手动跑 run_tests.py。
# 这里把后端测试与前端类型检查/构建都固定下来。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: 后端回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: decision-backend/decision-backend/requirements.txt

      - name: 安装依赖
        working-directory: decision-backend/decision-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        working-directory: decision-backend/decision-backend
        # 测试全部跑在系统临时目录，不需要真实 .env、不访问网络
        # （所有大模型调用在测试里都被替换为确定性桩）。
        run: python run_tests.py

  frontend-build:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json

      - name: 安装依赖
        working-directory: web-frontend
        run: npm ci

      - name: 类型检查
        working-directory: web-frontend
        # package.json 的 build 脚本只跑 vite，不带类型检查，因此单独跑一次
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: 构建
        working-directory: web-frontend
        run: npm run build

  repo-hygiene:
    name: 仓库卫生
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 检查逻辑放在脚本里（scripts/check_repo_hygiene.py）而不是内联 shell：
      # 最初写成 grep -E 匹配路径时把 glob `*.db` 当成了正则，
      # GNU grep 忽略前导 * 后等价于 `.db`，把 FeedbackBar.vue 误判成数据库文件。
      # 该脚本有单元测试覆盖（tests/test_repo_hygiene.py）。
      - name: 密钥与运行时数据没有进版本库
        run: python scripts/check_repo_hygiene.py
